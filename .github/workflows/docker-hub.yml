# ─────────────────────────────────────────────────────────────
# Pipeline 1: Build e Test
# ─────────────────────────────────────────────────────────────
name: Builds and Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── JOB 1: Testes ──────────────────────────────────────────
  Build:
    name: Compilar Projeto
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v3
        with:
          python-version: “3.11”

      - name: Instalar dependências
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest httpx # deps de teste
          
      - name: Executar testes com pytest
        run: |
          PYTHONPATH=. pytest tests/ -v --tb=short

# ─────────────────────────────────────────────────────────────
  Imagem:
    name: Construindo Imagem para Docker
    runs-on: ubuntu-latest
    needs: Build
    steps:
      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Lembre-se de ajusta com o ID da sua conta no dockerhub
      - name: Build e Push Docker
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: |
            ngaloni/senai_fastapi:latest
            ngaloni/senai_fastapi:${{ github.sha }}